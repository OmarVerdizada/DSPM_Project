# Sentro DSPM - shipping the service logs with Fluent Bit (D11).
# Set DSPM_LOG_FORMAT = "json" in sentro.toml: each line of <DataRoot>\logs\<service>.log
# is then one JSON object (ts, level, service, pid, logger, message, exception), already
# redacted of keys, tokens and passwords before it is written.
[SERVICE]
    Flush        5
    Parsers_File parsers.conf

[INPUT]
    Name         tail
    Path         C:\ProgramData\Sentro\logs\*.log
    Tag          sentro.*
    Parser       json
    DB           C:\ProgramData\fluent-bit\sentro-tail.db
    Refresh_Interval 10

[OUTPUT]
    Name         forward
    Match        sentro.*
    Host         logs.corp.example
    Port         24224
    tls          On
    tls.verify   On
