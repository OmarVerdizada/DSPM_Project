# PostgreSQL for a 32 GB Sentro node (console, workers and PostgreSQL on one host).
# Every figure is EXTRAPOLATED from docs/SCALING_ROADMAP_2026-10.md section 26.1;
# UNVERIFIED until the G2 gate has run on a host of this profile.

shared_buffers = 8GB                 # 26.1: 8 GB
effective_cache_size = 18GB          # shared_buffers plus the 10 GB of file cache left to it
work_mem = 24MB                      # sessions and work_mem together: about 2 GB
maintenance_work_mem = 1GB
max_connections = 100                # pools of the console and two workers (3 x 25), plus admin

# A first scan writes 25-35 GB of WAL per million files (26.2, EXTRAPOLATED): let checkpoints
# space out, and bound what is held on disk.
max_wal_size = 8GB
min_wal_size = 2GB
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9
wal_compression = on

# Estate rows are inserted at random keys: keep autovacuum ahead of a scan's writes.
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02
random_page_cost = 1.1               # SSD or NVMe storage
