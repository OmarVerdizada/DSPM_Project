# PostgreSQL for a 16 GB Sentro node (console, workers and PostgreSQL on one host).
# Every figure is EXTRAPOLATED from docs/SCALING_ROADMAP_2026-10.md section 26.1;
# UNVERIFIED until the G2 gate has run on a host of this profile.

shared_buffers = 4GB                 # 26.1: 4 GB
effective_cache_size = 8GB           # shared_buffers plus the 4 GB of file cache left to it
work_mem = 16MB                      # sessions and work_mem together: about 1 GB
maintenance_work_mem = 512MB
max_connections = 60                 # pools of the console and one worker (2 x 20), plus admin

# A first scan writes 25-35 GB of WAL per million files (26.2, EXTRAPOLATED): let checkpoints
# space out, and bound what is held on disk.
max_wal_size = 8GB
min_wal_size = 1GB
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9
wal_compression = on

# Estate rows are inserted at random keys: keep autovacuum ahead of a scan's writes.
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02
random_page_cost = 1.1               # SSD or NVMe storage
