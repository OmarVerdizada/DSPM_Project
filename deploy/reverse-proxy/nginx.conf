# Sentro behind nginx on the same host (C5). See README.md in this folder.
#
# The backend listens on loopback only:
#   python main.py serve --host 127.0.0.1 --port 8000
# with DSPM_TRUSTED_HOSTS=sentro.corp.example and DSPM_TRUSTED_PROXIES=127.0.0.1.
# Include this file inside the http { } block.

server {
    listen 80;
    server_name sentro.corp.example;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name sentro.corp.example;

    ssl_certificate     /etc/sentro/tls/sentro.crt;
    ssl_certificate_key /etc/sentro/tls/sentro.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Matches the backend's own DSPM_MAX_BODY_BYTES (25 MB by default).
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # Through unchanged: it must match DSPM_TRUSTED_HOSTS.
        proxy_set_header Host $host;
        # Replaced, not appended: a client's own X-Forwarded-For never reaches the backend.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;

        # Inventory exports stream.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
