name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Floor is 3.12 (roadmap M0/Q3, 2026-09-21): 3.10 leaves upstream support in
        # October 2026, and the lock is generated on the floor. The lowest leg is the
        # one that has to install from the hash-verified lock.
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies (runtime from the hash-verified lock)
        # M17: the matrix installs the runtime tree from the pinned, hash-verified
        # lock (reproducible + tamper-evident), then the dev-only test runner.
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock
          pip install -r requirements-dev.txt

      - name: Byte-compile all sources
        run: python -m compileall -q backend classification collectors discovery risk scripts permissions main.py

      - name: Run test suite
        # Baseline at the time of writing: 296 passed, 1 skipped.
        run: python -m pytest

  postgres:
    # Phase 6 (DB-12): migrations and the DB suites certified against a real
    # PostgreSQL on every change, not just the SQLite development backend.
    name: PostgreSQL suite
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          # The container's superuser only provisions. The suite runs as sentro_app below:
          # a superuser bypasses row-level security, so C0.5/C10's isolation tests would
          # prove nothing - and fail - if the application connected as one.
          POSTGRES_USER: ci_admin
          POSTGRES_PASSWORD: ci-admin-password
          POSTGRES_DB: sentro_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci_admin -d sentro_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DSPM_DB_URL: postgresql://sentro_app:ci-only-password@127.0.0.1:5432/sentro_ci
      CI_ADMIN_URL: postgresql://ci_admin:ci-admin-password@127.0.0.1:5432/sentro_ci
      DSPM_PG_TEST_RESET: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock
          pip install -r requirements-dev.txt

      - name: Provision the extensions and a least-privilege application role
        # As in production: the application role is no superuser, cannot bypass RLS and
        # cannot create roles. It owns the schema it migrates (role separation is a
        # recorded C0.5 deviation).
        run: |
          psql "$CI_ADMIN_URL" -v ON_ERROR_STOP=1 \
            -c "CREATE EXTENSION IF NOT EXISTS pg_trgm" \
            -c "CREATE EXTENSION IF NOT EXISTS btree_gin" \
            -c "CREATE ROLE sentro_app LOGIN PASSWORD 'ci-only-password' NOSUPERUSER NOBYPASSRLS NOCREATEROLE NOCREATEDB" \
            -c "GRANT CONNECT ON DATABASE sentro_ci TO sentro_app" \
            -c "GRANT USAGE, CREATE ON SCHEMA public TO sentro_app"

      - name: Migrations build the schema from empty (revisions recorded)
        run: |
          python -m backend.migrations upgrade
          python -m backend.migrations status

      - name: Run test suite on PostgreSQL
        run: python -m pytest

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # A push to main diffs against HEAD~1, which a depth-1 clone does not have; the
          # token gate now fails rather than report a diff it could not run as clean.
          fetch-depth: 2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      # Release gate recorded as outstanding in three fix reports under docs/:
      # these syntax checks were never run because Node was absent from the
      # development environment.
      - name: Syntax-check operator console JavaScript
        run: |
          for f in frontend/*.js; do
            echo "checking $f"
            node --check "$f"
          done

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      # Roadmap F0: the design-token contract. Checks only the CSS lines a
      # change ADDS, so the existing debt is frozen rather than blocking work,
      # and the page-by-page refit in F3 can remove it safely. A deliberate
      # exception is written on the line as `/* token-gate: allow - reason */`.
      - name: Frontend token gate
        run: |
          git fetch --no-tags --depth=1 origin "$GITHUB_BASE_REF" 2>/dev/null || true
          base="origin/$GITHUB_BASE_REF"
          git rev-parse --verify "$base" >/dev/null 2>&1 || base="HEAD~1"
          echo "comparing added CSS against $base"
          python scripts/check_frontend_tokens.py --base "$base"

      - name: Report frontend debt counters
        if: always()
        run: python scripts/check_frontend_tokens.py --stats

  static-analysis:
    # C7: the gates scripts/static_gate.py runs - no-undef over the console (pinned eslint),
    # Ruff's undefined-name checks, mypy on the security modules, Bandit against its reviewed
    # baseline, and the offline Semgrep rules in security/semgrep.yml. The tests that seed
    # each defect run here too, with every tool present, so a gate that stops catching
    # its defect fails as well.
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install the pinned tools
        # Semgrep gets a virtualenv of its own: its pins collide with the runtime lock.
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock
          pip install -r requirements-dev.txt -r requirements-static.txt
          python -m venv "$RUNNER_TEMP/semgrep-venv"
          "$RUNNER_TEMP/semgrep-venv/bin/pip" install -r requirements-semgrep.txt
          echo "SEMGREP_BIN=$RUNNER_TEMP/semgrep-venv/bin/semgrep" >> "$GITHUB_ENV"
          (cd frontend && npm ci --no-audit --no-fund)

      - name: Static gates
        run: python scripts/static_gate.py

      - name: The seeded defects fail their gates; every page renders hostile data safely
        run: python -m pytest tests/test_static_gates.py tests/test_console_renders.py tests/test_offline_console.py

  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Runtime state, developer-only assets and secrets must never be tracked.
      - name: Assert no generated or developer-only files are tracked
        run: |
          status=0
          while read -r pattern; do
            [ -z "$pattern" ] && continue
            matches=$(git ls-files -- "$pattern")
            if [ -n "$matches" ]; then
              echo "::error::tracked files match forbidden pattern '$pattern':"
              echo "$matches"
              status=1
            fi
          done <<'PATTERNS'
          data/**
          tmp/**
          **/__pycache__/**
          **/node_modules/**
          .obsidian/**
          .claude/**
          *.sqlite
          *.db
          *.pyc
          .env
          PATTERNS
          exit $status

      - name: Assert .env.example stays in sync with the code
        run: |
          missing=0
          vars=$(grep -rhoE '(os\.getenv|os\.environ\.get)\(\s*"DSPM_[A-Z_0-9]+"' \
            --include='*.py' . | grep -oE '"[A-Z_0-9]+"' | tr -d '"' | sort -u)
          for v in $vars; do
            if ! grep -qE "^#?\s*$v=" .env.example; then
              echo "::error::$v is read by the code but absent from .env.example"
              missing=1
            fi
          done
          exit $missing

      # H1 recurrence guard (security roadmap 0.2): a credential must never reach
      # a subprocess command line - it must be passed via the child env block.
      - name: Assert no credential reaches a command line
        run: python3 scripts/check_no_cmdline_secrets.py

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      # Fails the build if a credential/secret is committed. The repo ships
      # deliberate secret-like test fixtures under enterprise_test_data/, but
      # that path is gitignored and never tracked, so it is not scanned.
      - name: gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  supply-chain:
    name: Lock + SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install SBOM tooling
        run: python -m pip install cyclonedx-bom

      # Reproducibility gate: every runtime dependency installs from the pinned,
      # hash-verified lock. A stale or tampered lock fails here.
      - name: Hash-verified install from requirements.lock
        run: python -m pip install --require-hashes -r requirements.lock

      - name: Generate CycloneDX SBOM from the locked tree
        run: python -m cyclonedx_py requirements requirements.lock --of JSON --output-reproducible -o sbom.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom
          path: sbom.json

  dependency-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      # M16: fail the build on a known-vulnerable pinned Python dependency.
      - name: pip-audit the hash-locked tree (blocking)
        run: |
          python -m pip install pip-audit
          python -m pip_audit -r requirements.lock

  lock-drift:
    name: requirements.lock drift gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          # M17: the lock must be generated on the FLOOR Python so it is valid across
          # the whole matrix. The floor moved 3.10 -> 3.12 in roadmap M0/Q3.
          python-version: "3.12"

      # M17: regenerate the lock from requirements.txt and fail if the committed
      # lock drifted (requirements.txt edited without re-locking). The comparison
      # ignores the autogenerated header/annotation comments (which carry the
      # generating Python version) and checks the pins + hashes.
      - name: Regenerate and assert no lock drift
        run: |
          python -m pip install pip-tools
          cp requirements.lock requirements.lock.committed
          python -m piptools compile --quiet --generate-hashes --output-file=requirements.lock requirements.txt
          if ! diff <(grep -vE '^\s*#' requirements.lock.committed) <(grep -vE '^\s*#' requirements.lock) >/dev/null; then
            echo "::error::requirements.lock is out of sync with requirements.txt. Regenerate it on Python 3.12 with 'pip-compile --generate-hashes' and commit."
            diff <(grep -vE '^\s*#' requirements.lock.committed) <(grep -vE '^\s*#' requirements.lock) || true
            exit 1
          fi
