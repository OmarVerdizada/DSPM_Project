# Tooling configuration only.
#
# There is deliberately no [build-system] or [project] table: the application
# is deployed from a source checkout (`python main.py serve`), not installed as
# a distribution. Adding packaging metadata here would change how pip treats
# the directory, which is out of scope for the production-readiness pass.

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]

# Fail the run on unregistered marks and on config typos rather than silently
# skipping, so CI cannot pass because a test was never collected.
addopts = "-q --strict-markers --strict-config"

# The suite is stdlib unittest; these keep pytest's own noise out of CI logs
# while still surfacing real DeprecationWarnings from our dependencies.
filterwarnings = [
    "default",
    "ignore::DeprecationWarning:starlette.*",
]
